[project]
name = "canoe-config-autogen"
version = "0.1.0"
description = "Auto-generate CANoe configuration artifacts for CAN & LIN networks from DBC/LDF + Excel inputs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
