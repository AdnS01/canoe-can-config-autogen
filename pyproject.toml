[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canoe-autogen-can"
version = "1.0.0"
description = "Auto-generate CANoe configuration artifacts for CAN networks from DBC + Excel inputs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
